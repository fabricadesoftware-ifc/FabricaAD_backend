[project]
name = "fabricaAD_Backend"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "luansilva25", email = "luansilva250807@gmail.com"},
]
dependencies = ["django>=5.2", "djangorestframework>=3.16.0", "pillow==11.3.0", "python-magic>=0.4.27", "djangorestframework-simplejwt>=5.5.0", "drf-spectacular>=0.28.0", "django-filter>=25.1", "django-cors-headers>=4.7.0"]
requires-python = "==3.13.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[tool.pdm.scripts]
dev = 'python manage.py runserver'
makemigrations = 'python manage.py makemigrations'
migrate = 'python manage.py migrate'
createsuperuser = 'python manage.py createsuperuser'
